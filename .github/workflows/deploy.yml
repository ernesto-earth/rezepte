# Baut die Rezept-Seite aus claude-seite/ und lädt sie nach heger.earth/rezepte hoch.
# Läuft bei jedem Push auf main, der die Seite oder diesen Workflow ändert,
# oder manuell über "Actions → Deploy → Run workflow".
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER     FTP-Server, z. B. host28.ssl-net.net
#   FTP_USERNAME   FTP-Benutzer aus dem Domaintechnik Control Panel (Modul "FTP")
#   FTP_PASSWORD   Passwort dieses FTP-Benutzers
# Optionale Repository-Variablen:
#   FTP_PORT       FTP-Port, Standard 21
#   FTP_WEBROOT    Pfad des Webordners aus Sicht des FTP-Benutzers, Standard "www/"
#
# Hochgeladen bzw. überschrieben wird nur www/rezepte/. Gelöscht wird am Server nie etwas.

name: Deploy

on:
  push:
    branches: [main]
    paths: ["claude-seite/**", "bearbeiten/**", ".github/workflows/deploy.yml", "deploy-pruefen.mjs", "test-deploy-pruefen.mjs"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE: rezepte

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deployment-Prüfung offline testen
        run: node --test test-deploy-pruefen.mjs

      - name: Seite bauen (prüft auch, ob jedes Rezept vollständig ist)
        working-directory: claude-seite
        run: node build.mjs

      - name: Veröffentlichte Version ins Webverzeichnis schreiben
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const commit = process.env.GITHUB_SHA;
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error("GITHUB_SHA fehlt oder ist ungültig");
            writeFileSync("claude-seite/dist/version.json", JSON.stringify({ commit, deployed_at: new Date().toISOString() }, null, 2) + "\n");
          '

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_WEBROOT: ${{ vars.FTP_WEBROOT || 'www/' }}
        run: |
          set -euo pipefail
          server=$(echo "$FTP_SERVER" | tr -d '[:space:]')
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; \
            set net:max-retries 3; set net:timeout 30; \
            open --env-password -u $FTP_USERNAME -p $FTP_PORT $server; \
            mirror --reverse --verbose --no-perms --parallel=2 claude-seite/dist/ ${FTP_WEBROOT}${SITE}/; bye"

      - name: Bearbeiten-Seite einrichten (E-027)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_WEBROOT: ${{ vars.FTP_WEBROOT || 'www/' }}
          EDIT_PASSWORD: ${{ secrets.REZEPTE_EDIT_PASSWORD }}
          EDIT_TOKEN: ${{ secrets.REZEPTE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EDIT_PASSWORD" ] || [ -z "$EDIT_TOKEN" ]; then
            echo "::warning::Secrets REZEPTE_EDIT_PASSWORD und REZEPTE_GITHUB_TOKEN fehlen – Bearbeiten wird nicht eingerichtet."; exit 0; fi
          if [ "$FTP_WEBROOT" != "www/" ]; then
            echo "::error::Bearbeiten braucht FTP_WEBROOT=www/ (Zugangsdatei muss außerhalb des Webordners liegen)."; exit 1; fi
          server=$(echo "$FTP_SERVER" | tr -d '[:space:]')
          ftp() { { echo "set ftp:ssl-force true"; echo "set ftp:ssl-protect-data true"; echo "set ftp:passive-mode true"
                    echo "set net:max-retries 3"; echo "set net:timeout 30"
                    echo "open --env-password -u $FTP_USERNAME -p $FTP_PORT $server"; cat; echo "bye"; } > "$RUNNER_TEMP/c.lftp"
                  lftp -f "$RUNNER_TEMP/c.lftp"; }
          # Zugangsdatei außerhalb des Webordners: <FTP-Wurzel>/rezepte-data/config.php
          php -r 'echo "<?php\nreturn " . var_export(["password_hash" => password_hash(getenv("EDIT_PASSWORD"), PASSWORD_DEFAULT), "github_token" => getenv("EDIT_TOKEN"), "repo" => getenv("GITHUB_REPOSITORY"), "branch" => "main"], true) . ";\n";' > "$RUNNER_TEMP/config.php"
          printf 'mkdir -p -f rezepte-data\nput %s -o rezepte-data/config.php\nchmod 600 rezepte-data/config.php\nchmod 700 rezepte-data\n' "$RUNNER_TEMP/config.php" | ftp
          rm "$RUNNER_TEMP/config.php"
          # PHP-Version wie bei /cos/ (Control Panel), sonst PHP 8.3
          echo "get -e ${FTP_WEBROOT}cos/.htaccess -o $RUNNER_TEMP/cos.htaccess" | ftp || true
          handler=$(grep -iE '^[[:space:]]*(addhandler|suphp_configpath)[[:space:]]' "$RUNNER_TEMP/cos.htaccess" 2>/dev/null || true)
          echo "$handler" | grep -qi 'x-httpd-php8[1-9]' || handler="AddHandler x-httpd-php83 .php"
          { echo "$handler"; echo; cat bearbeiten/.htaccess; } > "$RUNNER_TEMP/b.htaccess"
          printf 'mkdir -p -f %srezepte/bearbeiten\nput bearbeiten/index.php -o %srezepte/bearbeiten/index.php\nput %s -o %srezepte/bearbeiten/.htaccess\n' \
            "$FTP_WEBROOT" "$FTP_WEBROOT" "$RUNNER_TEMP/b.htaccess" "$FTP_WEBROOT" | ftp
          sleep 3
          # Vorhandene Weiterleitungen ohne Zugangsdaten auflösen; Login erst am
          # geprüften Ziel, niemals Zugangsdaten blind einer Weiterleitung folgen lassen.
          node deploy-pruefen.mjs bearbeiten

      - name: Prüfen, ob die Seite erreichbar ist
        run: |
          sleep 3
          node deploy-pruefen.mjs seite
          node deploy-pruefen.mjs version "$GITHUB_SHA"
