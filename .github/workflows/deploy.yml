# Lädt jede Seite unter sites/<name>/ nach heger.earth/<name> hoch.
# Läuft bei jedem Push auf main, der etwas unter sites/ ändert, oder manuell
# über "Actions → Deploy → Run workflow".
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER     z. B. heger.earth (oder der FTP-Server aus dem Control Panel)
#   FTP_USERNAME   FTP-Benutzer aus dem Control Panel (Modul "FTP")
#   FTP_PASSWORD   Passwort dieses FTP-Benutzers
# Optionale Repository-Variable:
#   FTP_WEBROOT    Pfad des Webordners aus Sicht des FTP-Benutzers, Standard "www/"

name: Deploy

on:
  push:
    branches: [main]
    paths: ["sites/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  list-sites:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.ls.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: |
          sites=$(find sites -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -R . | jq -sc .)
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
          echo "Seiten: $sites"

  deploy:
    needs: list-sites
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.list-sites.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload sites/${{ matrix.site }} → /${{ matrix.site }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./sites/${{ matrix.site }}/
          server-dir: ${{ vars.FTP_WEBROOT || 'www/' }}${{ matrix.site }}/
          # Merkt sich auf dem Server, was schon oben ist, und lädt nur Änderungen hoch.
          # Löscht nur Dateien, die es selbst hochgeladen hat – nie etwas anderes im Webordner.

      - name: Prüfen, ob die Seite erreichbar ist
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://heger.earth/${{ matrix.site }}/")
          echo "https://heger.earth/${{ matrix.site }}/ → HTTP $code"
          test "$code" = "200"
