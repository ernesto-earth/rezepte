<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Am Tisch – Kochmodus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4F0}
a{color:#1E1A17}a:hover{color:#C2410C}
.nav a{color:#E9E4DE;text-decoration:none;font-size:14px;font-weight:500;padding:19px 1px 16px;border-bottom:3px solid transparent}
.nav a:hover{color:#FFFFFF}
.chip{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:0 16px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid #DDD6CD}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.card{background:#FFFFFF;border-radius:14px;overflow:hidden;text-decoration:none;color:#1E1A17;display:flex;flex-direction:column}
.card:hover{color:#1E1A17;box-shadow:0 8px 24px rgba(30,26,23,.12)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1E1A17; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column">
<header style="padding: 14px 18px 0; display: flex; align-items: center; gap: 10px">
<a href="MobilListe.dc.html" aria-label="Kochmodus beenden" style="width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<div style="flex: 1"><div style="font-size: 12px; color: #B9B0A6; letter-spacing: .06em; text-transform: uppercase; font-weight: 700">Kochmodus</div><div style="font-weight: 600">Grenadiermarsch</div></div>
<button type="button" onClick="{{toggle}}" aria-expanded="{{open}}" style="font: inherit; font-size: 13px; font-weight: 600; color: #1E1A17; background: #F08A5D; border: 0; border-radius: 999px; padding: 0 14px; min-height: 40px; cursor: pointer">Zutaten</button>
</header>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 16px 18px 0" aria-hidden="true">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><span style="height: 5px; border-radius: 3px; {{b.style}}"></span></sc-for>
</div>
<main style="flex: 1; padding: 26px 22px 0; display: flex; flex-direction: column; gap: 14px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #F08A5D; letter-spacing: .03em; text-transform: uppercase">Schritt {{n}} von {{total}}</div>
<p style="margin: 0; font-size: 23px; line-height: 1.45">{{text}}</p>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div style="background: #2C2622; border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.7; color: #E9E4DE">
<sc-for list="{{ing}}" as="i" hint-placeholder-count="7"><div>{{i}}</div></sc-for>
</div>
</sc-if>
</main>
<p style="margin: 0; padding: 0 22px 10px; font-size: 12px; color: #B9B0A6">Der Bildschirm bleibt im Kochmodus an.</p>
<nav aria-label="Schritte" style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 0 18px 26px">
<button type="button" onClick="{{prev}}" style="font: inherit; font-weight: 600; min-height: 56px; border-radius: 14px; border: 1px solid #4F4740; background: transparent; color: #FFFFFF; cursor: pointer">Zurück</button>
<button type="button" onClick="{{next}}" style="font: inherit; font-weight: 700; font-size: 17px; min-height: 56px; border-radius: 14px; border: 0; background: #C2410C; color: #FFFFFF; cursor: pointer">{{nextLabel}}</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { s: 1, open: false }; }
renderVals() {
const STEPS = ["Zwei Töpfe mit Salzwasser aufkochen. Im einen den Kürbis, im anderen die Teigwaren jeweils bissfest garen, dann beides abseihen.", "Zwiebel schälen und fein schneiden. Die Dürre enthäuten und in mundgerechte Stücke schneiden.", "Öl in einem großen Topf erhitzen, die Zwiebel anbraten, Dürre dazugeben und mitbraten, bis Röststellen entstehen. Topf vom Herd ziehen und das Paprikapulver einrühren. Kürbis und Teigwaren untermischen, mit Salz und Pfeffer abschmecken.", "Schnittlauch fein schneiden und den Grenadiermarsch vor dem Servieren damit bestreuen."];
const ING = ["400 g Kürbis, gewürfelt (z. B. Hokkaido, geschält)", "300 g Teigwaren (z. B. Fleckerl)", "1 große Zwiebel", "250 g Dürre", "1 EL Paprikapulver, edelsüß", "10 g Schnittlauch", "Öl, Salz und Pfeffer"];
const s = this.state.s, total = STEPS.length;
return { n: s, total, text: STEPS[s - 1], ing: ING, open: this.state.open,
  toggle: () => this.setState({ open: !this.state.open }),
  bars: STEPS.map((_, i) => ({ style: i < s ? 'background: #F08A5D' : 'background: #4F4740' })),
  prev: () => this.setState({ s: Math.max(1, s - 1) }),
  next: () => this.setState({ s: s < total ? s + 1 : 1 }),
  nextLabel: s < total ? 'Weiter' : 'Fertig – Mahlzeit!' };
}
}
</script>
</body>
</html>
